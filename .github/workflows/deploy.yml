name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: dpfkuremcp
  REGION: asia-northeast1
  SERVICE_NAME: kure-mcp-server
  IMAGE: asia-northeast1-docker.pkg.dev/${{ env.PROJECT_ID }}/kure-mcp/server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity用

    steps:
      - uses: actions/checkout@v4

      # Workload Identity でキーレス認証（推奨）
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push
        run: |
          gcloud builds submit \
            --tag ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated
