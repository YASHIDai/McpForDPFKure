name: Build and Deploy to Cloud Run

# mainブランチへのpush時に自動実行
# 手動実行も可能（workflow_dispatch）
on:
  push:
    branches:
      - main
  workflow_dispatch:

# WIF認証に必要なpermissions
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. ソースコードのチェックアウト
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Google CloudへのWIF認証
      # サービスアカウントキーが不要なキーレス認証
      # -------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # -------------------------------------------------------
      # 3. gcloud CLIのセットアップ
      # -------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # -------------------------------------------------------
      # 4. Artifact Registry への Docker 認証
      # -------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      # -------------------------------------------------------
      # 5. Dockerイメージのビルド
      # コミットSHAをタグに使うことで履歴管理が容易になる
      # -------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }} \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:latest \
            .

      # -------------------------------------------------------
      # 6. Artifact RegistryへのDockerイメージpush
      # -------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:latest

      # -------------------------------------------------------
      # 7. Cloud Runへのデプロイ
      # Secret ManagerのシークレットをCloud Runに注入
      # -------------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --set-secrets "KURE_ECP_API_KEY=KURE_ECP_API_KEY:latest" \
            --set-secrets "MCP_ACCESS_TOKEN=MCP_ACCESS_TOKEN:latest" \
            --allow-unauthenticated \
            --quiet

      # -------------------------------------------------------
      # 8. デプロイ結果のURL表示
      # -------------------------------------------------------
      - name: Show deployed URL
        run: |
          gcloud run services describe ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.GCP_REGION }} \
            --format="value(status.url)"
